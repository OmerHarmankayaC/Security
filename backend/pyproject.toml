[project]
name = "vardiya-cizelgeleme"
version = "0.1.0"
description = "VARDIS vardiya cizelgeleme karar destek araci - backend"
requires-python = ">=3.12"
# Gosterim sunucusu Ubuntu 26.04 / Python 3.14 (deponun tek surumu; ayni
# makinedeki diger projeler de onu kullaniyor). Asagidaki UC sabit, derlenmis
# uzantilari Python 3.14 icin tekerlek tasimadigi icin yukseltildi - kaynaktan
# derlemek Rust/C++ zinciri gerektirirdi. Her biri, 3.14 tekerlegi bulunan EN
# DUSUK surumdur (PyPI'dan tarandi); gereksiz yukselme yok. Yukseltmelerden
# sonra tam test paketi (163 test; cozucu-dogrulayici uyum testi ve agirlik
# kalibrasyonu dahil) ve kabul olcumu 5/5 ile dogrulandi - sayilar
# degismedi. Bkz. PROGRESS.md, 08.08.2026 dagitim kaydi.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    # 2.0.36 -> 2.0.41: 2.0.36 Python 3.14'te KURULUYOR ama calisma aninda
    # cokuyor (typing.Union.__getitem__ degisti). SQLAlchemy 3.14
    # siniflandiricisi yayinlamadigi icin asgari surum ampirik bulundu:
    # 2.0.37/.39/.40 hata veriyor, 2.0.41 calisiyor.
    "sqlalchemy==2.0.41",
    "alembic==1.14.0",
    # 3.2.3 -> 3.2.10: psycopg-binary tekerlegi 3.14 icin buradan itibaren var.
    "psycopg[binary]==3.2.10",
    # 2.10.4 -> 2.12.0: 2.10.4, pydantic-core==2.27.2'yi TAM sabitler ve onun
    # 3.14 tekerlegi yok. pydantic-core 2.35+ isteyen en dusuk pydantic 2.12.0
    # (pydantic-core==2.41.1 ile gelir).
    "pydantic==2.12.0",
    "pydantic-settings==2.7.1",
    # 9.14.6206 -> 9.15.6755: 9.14'un 3.14 tekerlegi yok.
    "ortools==9.15.6755",
    # Parola ozeti icin Argon2id (SDD 5.1b, SRS FR-10.2). Derlenmis uzantiyi
    # tasiyan alt paket argon2-cffi-bindings, KARARLI ABI tekerlegi yayinlar
    # (cp39-abi3-manylinux_2_28_x86_64), yani gosterim sunucusunun Python
    # 3.14'unde de kaynaktan derleme gerektirmez - yukaridaki uc paketin
    # yasadigi sorun burada yok, surum yukseltmesi gerekmiyor.
    "argon2-cffi==25.1.0",
    # Resmi tatil takvimi (FR-1.10). Dini bayramlarin tarihi hicri takvime
    # baglidir ve her yil kayar; sabit tarihli bir liste yazmak, dogru
    # sanilan yanlis bir veri uretirdi. Kutuphane Turkiye'yi Turkce adlarla
    # ve cok gunlu bayram araliklariyla veriyor (bkz. app/services/
    # tatil_takvimi.py). Surum sabitlemesi diger bagimliliklarla ayni
    # sozlesmede; takvim verisi surumle birlikte degistigi icin kendiliginden
    # guncellenmesi ISTENMEZ - tatil listesinin ne zaman degistigi
    # izlenebilir olmali.
    "holidays==0.102",
    # Excel ciktisi (SRS FR-8.5, FR-8.9; SDD 5.8). Saf Python, derleme
    # gerektirmez ve grafik (BarChart + LineChart birlesimi) uretebilir -
    # adalet grafiginin referans cizgisi bu birlesimle ciziliyor. Surum
    # sabitlemesi digerleriyle ayni sozlesmede.
    "openpyxl==3.1.5",
    # Izin belgesi yuklemesi (cok parcali form govdesi). FastAPI dosya
    # yuklemesini bu paket olmadan AYRISTIRAMAZ ve `UploadFile` tanimlayan
    # bir uc nokta import aninda patlar - istege bagli degildir, dosya
    # yukleyen her kurulumda bulunmak zorundadir. Saf Python, derleme
    # gerektirmez.
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
